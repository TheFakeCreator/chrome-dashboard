<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chrome Dashboard - Your Productivity Hub">
  <title>New Tab - Chrome Dashboard</title>
  
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="src/styles/tailwind.css">
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Loading State -->
    <div id="loading" class="fixed inset-0 bg-dark-bg flex items-center justify-center z-50">
      <div class="text-center space-y-4">
        <div class="inline-block animate-spin">
          <i data-lucide="loader-circle" class="w-12 h-12 text-primary-500"></i>
        </div>
        <h2 class="text-2xl font-semibold text-dark-text">Loading Dashboard...</h2>
        <p class="text-dark-muted">Initializing your productivity hub</p>
      </div>
    </div>

    <!-- Panel Container - Managed by PanelManager -->
    <div id="panel-container" style="display: none;">
      <!-- Panels will be dynamically created here -->
    </div>

    <!-- Header Actions (Floating) -->
    <div id="header-actions" class="fixed top-6 right-6 z-50 flex items-center gap-2" style="display: none;">
      <button id="btn-theme" class="p-2.5 rounded-xl bg-dark-surface/80 backdrop-blur-lg border border-dark-border hover:bg-dark-elevated transition-all shadow-lg" title="Toggle Theme">
        <i data-lucide="sun" class="w-5 h-5 text-dark-text"></i>
      </button>
      
      <button id="btn-settings" class="p-2.5 rounded-xl bg-dark-surface/80 backdrop-blur-lg border border-dark-border hover:bg-dark-elevated transition-all shadow-lg" title="Settings">
        <i data-lucide="settings" class="w-5 h-5 text-dark-text"></i>
      </button>
    </div>

    <!-- Panel Navigation Indicators -->
    <div id="panel-indicators" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50" style="display: none;">
      <div class="flex items-center gap-3 px-4 py-2 rounded-full bg-dark-surface/80 backdrop-blur-lg border border-dark-border shadow-lg">
        <!-- Indicators will be dynamically updated -->
      </div>
    </div>

    <!-- Error State -->
    <div id="error" class="fixed inset-0 bg-dark-bg flex items-center justify-center z-50" style="display: none;">
      <div class="text-center space-y-6 max-w-md px-6">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-red-500/10 rounded-full">
          <i data-lucide="alert-circle" class="w-10 h-10 text-red-500"></i>
        </div>
        <h2 class="text-2xl font-semibold text-dark-text">Something Went Wrong</h2>
        <p id="error-message" class="text-dark-muted">An error occurred while loading the dashboard.</p>
        <button id="btn-retry" class="btn btn-primary">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          <span>Retry</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-root"></div>

  <!-- Notification Container -->
  <div id="notification-root"></div>

  <!-- Main Script -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
